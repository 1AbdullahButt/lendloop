# The only door from the internet into n8n. The cloudflared quick tunnel points here, not at
# n8n: a quick tunnel has no ingress rules, so without this proxy the whole n8n editor and its
# login page would be public at the tunnel URL. Only webhooks and the health check pass; the
# editor stays on http://localhost:5678 (the port docker-compose publishes on this machine).
server {
  listen 80;
  server_name _;
  server_tokens off;

  # Everything else, including /, /signin, /rest/* and /home/*, does not exist out here.
  location / {
    return 404;
  }

  location = /healthz {
    proxy_pass http://n8n:5678/healthz;
  }

  # Production webhooks only. /webhook-test/ (the editor's test listener) is deliberately absent.
  location ^~ /webhook/ {
    proxy_pass http://n8n:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 1m;
  }
}
